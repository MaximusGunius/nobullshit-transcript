<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nobullshit YT Transcript Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 0.5rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      outline: none;
      margin-bottom: 1.25rem;
    }
    input[type="text"]:focus { border-color: #555; }
    button {
      width: 100%;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: 600;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: #ddd; }
    button:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
    }
    #status {
      margin-top: 1rem;
      font-size: 0.9rem;
      min-height: 1.2em;
      text-align: center;
    }
    #status.error { color: #f87171; }
    #status.success { color: #4ade80; }
    .footer {
      margin-top: 1.75rem;
      font-size: 0.75rem;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Nobullshit YT Transcript</h1>
    <p class="subtitle">Paste a YouTube link. Get the transcript as a .txt file named after the video.</p>

    <label for="url">YouTube URL</label>
    <input
      type="text"
      id="url"
      placeholder="https://www.youtube.com/watch?v=..."
      autocomplete="off"
      spellcheck="false"
    />

    <button id="download" disabled>Download transcript</button>
    <div id="status" role="status" aria-live="polite"></div>

    <div class="footer">No account. No tracking. Just the text.</div>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
